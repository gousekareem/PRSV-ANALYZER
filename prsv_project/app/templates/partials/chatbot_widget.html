<button id="chatbot-launcher" class="chatbot-launcher" type="button" aria-label="Open farmer assistant chat" aria-expanded="false" aria-controls="chatbot-panel">
    💬
</button>

<div id="chatbot-panel" class="chatbot-panel" role="dialog" aria-label="Farmer assistant chat" aria-hidden="true">
    <div class="chatbot-header">
        <img src="/static/img/logo-icon.png" alt="" class="chatbot-header-logo">
        <div>
            <h3>Farmer Assistant</h3>
            <p>Ask about papaya leaf health · type, speak, or send a photo</p>
        </div>
        <button id="chatbot-close" class="chatbot-close" type="button" aria-label="Close chat">✕</button>
    </div>

    <div class="chatbot-lang-select">
        <select id="chatbot-language" aria-label="Choose your language">
            <option value="en">English</option>
            <option value="hi">हिन्दी (Hindi)</option>
            <option value="te">తెలుగు (Telugu)</option>
            <option value="ta">தமிழ் (Tamil)</option>
            <option value="kn">ಕನ್ನಡ (Kannada)</option>
            <option value="ml">മലയാളം (Malayalam)</option>
            <option value="bn">বাংলা (Bengali)</option>
            <option value="mr">मराठी (Marathi)</option>
            <option value="gu">ગુજરાતી (Gujarati)</option>
            <option value="pa">ਪੰਜਾਬੀ (Punjabi)</option>
        </select>
    </div>

    <div id="chatbot-messages" class="chatbot-messages" aria-live="polite"></div>

    <form id="chatbot-form" class="chatbot-input-row">
        <button id="chatbot-photo-btn" class="chatbot-icon-btn" type="button" aria-label="Attach a leaf photo" title="Attach a leaf photo">📷</button>
        <input id="chatbot-photo-input" type="file" accept="image/*" capture="environment" hidden>
        <button id="chatbot-mic-btn" class="chatbot-icon-btn" type="button" aria-label="Speak your question" title="Speak your question">🎤</button>
        <input id="chatbot-text-input" type="text" placeholder="Type your question..." autocomplete="off" aria-label="Type your question">
        <button class="chatbot-send-btn" type="submit" aria-label="Send message">➤</button>
    </form>
</div>
