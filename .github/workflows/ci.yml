name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-base:
    # Tests the app + full v3.0 feature set that works with only the
    # lightweight dependency set (no PyTorch/mlflow) - this is the fast,
    # reliable path and matches what most contributors will actually install.
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: prsv_project/requirements.txt

      - name: Install dependencies
        working-directory: prsv_project
        run: pip install -r requirements.txt

      - name: Run test suite
        working-directory: prsv_project
        run: pytest -q

  test-full:
    # Same test suite with the optional heavy packages (sentence-transformers,
    # faiss-cpu, mlflow) also installed, to catch regressions in the
    # highest-quality code paths (dense/hybrid retrieval, MLflow logging).
    # Allowed to fail without blocking merges, since it depends on a large
    # PyTorch download that can be flaky in CI - test-base is the required check.
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            prsv_project/requirements.txt
            prsv_project/requirements-optional.txt

      - name: Install dependencies
        working-directory: prsv_project
        run: pip install -r requirements.txt -r requirements-optional.txt

      - name: Run test suite
        working-directory: prsv_project
        run: pytest -q
